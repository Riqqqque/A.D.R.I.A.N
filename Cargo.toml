[workspace]
resolver = "3"
members = ["crates/protocol", "crates/server", "crates/satellite", "crates/pc-control", "crates/desktop"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
