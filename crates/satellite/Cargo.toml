[package]
name = "adrian-satellite"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native Windows voice satellite for Adrian (Gate B — in progress)."

[features]
# Local wake-word spotting via rustpotter (pulls the candle ML stack, so it
# is opt-in). Requires a trained .rpw model — see docs.
wake-word = ["dep:rustpotter", "dep:half"]

[dependencies]
adrian-protocol = { path = "../protocol" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-native-roots"] }
futures-util = "0.3.34"
reqwest = { version = "0.13.5", features = ["json"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow = "1.0.100"
cpal = "0.16.0"
hound = "3.5.1"
rodio = "0.20.1"
tts = "0.26.3"
global-hotkey = "0.7.0"
directories = "6.0.0"
rustpotter = { version = "3.0.2", optional = true }
half = { version = "=2.4.1", optional = true }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.21.0"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
